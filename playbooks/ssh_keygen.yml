
## HOW TO RUN: 

## 1. Get on jump box
## 2. Install Crypto collection : ansible-galaxy collection install community.crypto
## 3. Run command (e.g) : ansible-playbook -i Inventory.yml PLAYBOOKS/linux-ssh-keys.yaml -e "passphrase=WeLoveLunarMining!"
## 4. Run Command (Disables password auth)  : ansible linux -i Inventory.yml -m shell -a "sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && systemctl reload ssh" -b
## 5. Run Command (Same as above but just for Balrog since it runs Alpine) : ansible balrog -i Inventory.yml -m shell -a "sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && rc-service sshd reload" -b
## 6. Start local ssh agent : eval "$(ssh-agent -s)"
## 7. Unlock keys locally (per machine) : ssh-add ~/.ssh/id_ed25519_balrogssh-add ~/.ssh/id_ed25519_donutssh-add ~/.ssh/id_ed25519_brassknuckels
## 8. ssh root@...

## End goal: Can just remote in from Jump box, remote nodes match their public keys with its private. 

# 1. Targets the 'linux' group from Inventory.yml and logs in as root
- name: Create and distribute SSH keys for Linux hosts
  hosts: linux
  remote_user: root

  tasks:
    # 2. Tells Ansible to run this step locally on the jump box, not the remote router
    - name: Generate a unique ed25519 SSH keypair locally for each host
      delegate_to: localhost
      community.crypto.openssh_keypair:
        # 3. Save the private key on the jump box, naming it after the current target machine
        path: "~/.ssh/id_ed25519_{{ inventory_hostname }}"
        # 4. Use the secure ed25519 cryptographic algorithm
        type: ed25519
        # 5. Generate a unique passphrase to protect the private key using MD5 hash logic
        passphrase: "{{ 'root' ~ inventory_hostname ~ passphrase | hash('md5') }}"
        # 6. Does not overwrite the key if one already exists, prevents lockouts
        force: no
      # 7. Save the output including the public key into a temp variable 'ssh_key'
      register: ssh_key

    # 8. Pushes public key across the network to target machines
    - name: Push the public key to the remote host's authorized_keys
      ansible.posix.authorized_key:
        # 9. Places it in root user's authorized_keys profile
        user: root
        # 10. Ensures the key exists in the file (adds if missing, does nothing if already there)
        state: present
        # 11. Takes the public key text from the temporary variable and inject it
        key: "{{ ssh_key.public_key }}"
