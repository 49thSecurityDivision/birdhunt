---
# =============================================================================
# WINDOWS DEFENSIVE TOOLING DEPLOYMENT
#
# Downloads Sysinternals Suite and Malwarebytes offline installer,
# extracts Sysinternals to C:\Tools\Sysinternals, and adds it to the system PATH.
# =============================================================================

- name: Download Sysinternals Suite and Malwarebytes for Windows
  hosts: windows
  gather_facts: false
  vars:
    download_dir: 'C:\Temp\Installers'
    sysinternals_dir: 'C:\Tools\Sysinternals'
    sysinternals_url: 'https://download.sysinternals.com/files/SysinternalsSuite.zip'
    malwarebytes_url: 'https://downloads.malwarebytes.com/file/mb5_offline'

  tasks:
    - name: Ensure download and target directories exist
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ download_dir }}"
        - "{{ sysinternals_dir }}"

    - name: Download Sysinternals Suite ZIP archive
      ansible.windows.win_get_url:
        url: "{{ sysinternals_url }}"
        dest: "{{ download_dir }}\\SysinternalsSuite.zip"
        force: false

    - name: Extract Sysinternals Suite to target directory
      community.windows.win_unzip:
        src: "{{ download_dir }}\\SysinternalsSuite.zip"
        dest: "{{ sysinternals_dir }}"

    - name: Add Sysinternals directory to system PATH
      ansible.windows.win_path:
        elements:
          - "{{ sysinternals_dir }}"
        scope: machine
        state: present

    - name: Download Malwarebytes offline installer
      ansible.windows.win_get_url:
        url: "{{ malwarebytes_url }}"
        dest: "{{ download_dir }}\\MBSetup.exe"
        force: false
