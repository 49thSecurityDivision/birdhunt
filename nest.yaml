# =============================================================================
# BIRDHUNT - "NEST" INVENTORY (COMPETITION TEMPLATE)
#
# This inventory ships empty for competition readiness.
# To populate this inventory interactively and test connectivity, run:
#     ./lay_egg.sh
#
# A populated sample reference is available in: nest.example.yaml
# =============================================================================

all:
  children:
    windows:
      hosts: {}
      vars:
        ansible_user: administrator
        ansible_password: ""
        ansible_connection: winrm
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_transport: ntlm
        seed_val: CCDC2026SecureSeed!

    linux:
      hosts: {}
      vars:
        ansible_user: root
        ansible_password: ""
        ansible_connection: ssh
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_password: "{{ ansible_password }}"
        seed_val: CCDC2026SecureSeed!

    jumpbox:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
